server {
    listen 80;
    
    # Aceita qualquer subdomínio dinâmico de lvh.me (local) ou do seu domínio (produção)
    server_name *.lvh.me *.meusistema.com meusistema.com;

    location / {
        # 'app' é o nome do serviço Node.js definido no docker-compose
        proxy_pass http://app:3000; 
        
        # CONFIGURAÇÕES CRUCIAIS PARA MULTI-TENANT:
        # Passa o host original (ex: cliente1.lvh.me) para o Express conseguir ler
        proxy_set_header Host $host;
        
        # Repassa o IP real do cliente para a aplicação
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Suporte a WebSockets (caso use socket.io ou similar no futuro)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        proxy_cache_bypass $http_upgrade;
    }
}